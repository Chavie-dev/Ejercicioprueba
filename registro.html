<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            body {font-family: Arial; padding: 20px;}
            table {width: 100%; border-collapse: collapse; margin-top: 20px;}
            th, td {border: 1px solid #fff; padding: 8px; text-align: left;}
            th {background-color: #ecb0a4; color: white;}
            
            form {background: #f23030; padding: 20px; border-radius: 5px; width: 300px;}
            input, button {width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box;}
            button {background: black; color: white; border: none; cursor: pointer;}
        </style>
    </head>
    
    <body>
        <a href="index.php" class="BotonInicio">Volver a pagina principal </a>
        <form id="formRegistro" action="registro.php" method="POST">

            <h3>Registro</h3>
            <label>Nombre: </label>
            <input type="text" name="nombre" required>

            <label>Correo: </label>
            <input type="email" name="email" required>

            <label>Contraseña: </label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Enviar</button>
        </form>

        <script>
            document.getElementById('formRegistro').addEventListener('submit', function(e) {
                let password = document.getElementById('password').value;

                // Validacion: La contraseña debe tener al menos 6 caracteres
                if (password.length < 6) {
                    alert('Error: La contraseña debe tener mínimo 6 caracteres.');
                    e.preventDefault(); // Detiene el envío si no cumple la regla
                } else {
                    alert('¡Validación JS correcta! Enviando datos al servidor...');
                }
            });
        </script>
    </body>
</html>
